// A test of Resource Transfer Fix, not a mod to play with: gives the FL-T200 a B9PartSwitch switch that
// works in flight, between liquid fuel and oxidizer (90 and 110 units, as stock has it) and liquid fuel
// only (200 units). The tank types are the ones B9PartSwitch defines (DefaultTankTypes.cfg).
@PART[fuelTankSmall]:NEEDS[B9PartSwitch]
{
	!RESOURCE,* {}
	MODULE
	{
		name = ModuleB9PartSwitch
		moduleID = fuelSwitch
		switcherDescription = Tank
		baseVolume = 200
		switchInFlight = True
		SUBTYPE
		{
			name = LFO
			tankType = LFO
		}
		SUBTYPE
		{
			name = LiquidFuel
			tankType = LiquidFuel
		}
	}
}
