// Read once when KSP starts: quit KSP, edit this file, start KSP again.

// Stops a resource transfer once nothing flows through it any more: the tank that sends stops when no tank
// takes from it, a tank that takes stops when no tank sends to it. Stock stops a tank that sends only when
// it is empty, so its Stop button stays after the tank it filled is full.
stopIdleTransfers = True

// Pairs every transfer of a part action window with the transfers of the same resource in the other open
// windows. Stock can leave a transfer paired with no tank at all, so that its In and Out buttons do
// nothing: after the window of a tank holding liquid fuel only, the oxidizer of the next tank, say.
linkAllTransfers = True

// How much the mod writes to KSP.log: Error, Warning, Info or Debug. At Debug, one line for every transfer
// the mod stops and every link it adds that stock does not make at that point.
logLevel = Info
